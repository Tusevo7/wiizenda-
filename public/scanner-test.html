
<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Scanner Wizenda</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      margin: 0;
      padding: 25px 20px;
      background: #f7f7f7;
      font-family: Arial, sans-serif;
    }

    .card {
      max-width: 500px;
      margin: 0 auto;
      padding: 25px;
      background: white;
      border-radius: 24px;
    }

    h1 {
      margin-top: 0;
    }

    #reader {
      width: 100%;
      margin-top: 25px;
    }

    button,
    a {
      display: block;
      width: 100%;
      box-sizing: border-box;
      padding: 18px;
      margin-top: 15px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
    }

    button {
      border: none;
      background: #ff5a1f;
      color: white;
    }

    a {
      background: #111;
      color: white;
    }

    #resultado {
      margin-top: 20px;
      padding: 15px;
      border-radius: 16px;
      background: #f1f5f9;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Scanner de bilhetes</h1>

    <p>
      Aponte a câmera para o QR Code do bilhete.
    </p>

    <button
      id="abrir"
      type="button"
    >
      ABRIR CÂMERA
    </button>

    <div id="reader"></div>

    <div id="resultado">
      Aguardando câmera...
    </div>

    <a href="/agency">
      VOLTAR PARA AGÊNCIA
    </a>

  </div>

  <script>
    let scanner = null;

    document
      .getElementById('abrir')
      .addEventListener('click', async function () {

        const resultado =
          document.getElementById('resultado');

        resultado.textContent =
          'A iniciar câmera...';

        try {

          scanner =
            new Html5Qrcode('reader');

          await scanner.start(
            {
              facingMode: 'environment'
            },
            {
              fps: 10,
              qrbox: {
                width: 250,
                height: 250
              }
            },
            async function (decodedText) {

              resultado.textContent =
                'QR ENCONTRADO: ' +
                decodedText;

              await scanner.stop();

            },
            function () {
              // Ignorar leituras que não sejam QR.
            }
          );

          resultado.textContent =
            'Câmera aberta. Aponte para o QR Code.';

        } catch (error) {

          resultado.textContent =
            'ERRO AO ABRIR CÂMERA: ' +
            error;

        }

      });
  </script>

</body>
</html>
